<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TENY · 马达加斯加语学习台</title>
<meta name="description" content="单词卡、双语例句、马达加斯加语词典，三个入口。" />
<meta name="theme-color" content="#f6f1e6" />
<link rel="icon" href="/wordcard/assets/img/icon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/site.css" />
<style>
  .home {
    max-width: 1080px;
    margin: 0 auto;
    padding: clamp(30px, 8vw, 76px) clamp(18px, 4vw, 28px) 56px;
  }
  .eyebrow {
    margin: 0;
    font-size: 12px;
    letter-spacing: 0.2em;
    font-weight: 600;
    color: var(--primary);
  }
  .hero h1 {
    font-family: var(--tn-serif);
    font-size: clamp(52px, 12vw, 92px);
    line-height: 0.92;
    letter-spacing: 0.02em;
    margin: 14px 0 18px;
    color: var(--tn-forest);
  }
  .hero h1 span {
    display: block;
    margin-top: 16px;
    font-family: var(--tn-serif);
    font-size: clamp(16px, 4vw, 24px);
    font-weight: 400;
    letter-spacing: 0.28em;
    color: #807b6e;
  }
  .sub {
    max-width: 35em;
    margin: 0;
    color: #4c4a42;
    font-size: clamp(15px, 2.6vw, 17px);
    line-height: 1.85;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
    margin-top: clamp(28px, 6vw, 52px);
  }
  .card {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 22px 20px 18px;
    background: var(--card);
    border: 1px solid var(--tn-line);
    border-radius: 18px;
    box-shadow: 0 1px 2px rgba(27, 26, 22, 0.05);
    text-decoration: none;
    color: inherit;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: #2f7a62;
    box-shadow: 0 12px 28px rgba(18, 63, 51, 0.1);
  }
  .icon {
    width: 46px;
    height: 46px;
    display: grid;
    place-items: center;
    border-radius: 14px;
    background: var(--primary-soft);
    font-size: 23px;
  }
  .card h2 {
    margin: 4px 0 0;
    font-family: var(--tn-serif);
    font-size: 21px;
    color: var(--tn-forest);
  }
  .card p {
    flex: 1;
    margin: 0;
    color: #6b7d76;
    font-size: 14px;
    line-height: 1.7;
  }
  .go { font-size: 13.5px; font-weight: 600; color: var(--primary); }
  footer {
    margin-top: 44px;
    padding-top: 16px;
    border-top: 1px solid var(--tn-line);
    color: #807b6e;
    font-size: 12.5px;
    letter-spacing: 0.04em;
  }
  @media (max-width: 760px) {
    .cards { grid-template-columns: 1fr; }
    .card { flex-direction: row; align-items: flex-start; flex-wrap: wrap; }
    .card h2 { width: calc(100% - 62px); }
    .card p { width: 100%; padding-left: 56px; }
    .go { padding-left: 56px; }
  }
</style>
</head>
<body>
<main class="home">
  <header class="hero">
    <p class="eyebrow">MALAGASY · 学习工作台</p>
    <h1>TENY<span>马达加斯加语</span></h1>
    <p class="sub">从一张单词卡，到一整句对照，再到词根与派生词网络。三个入口，一处安放。</p>
  </header>

  <section class="cards" aria-label="三个学习入口">
    <a class="card" href="/wordcard/">
      <span class="icon">📚</span>
      <h2>单词卡</h2>
      <p>输入、翻转、双向累计；背满自动归档，支持多设备同步。</p>
      <span class="go">进入单词卡 →</span>
    </a>
    <a class="card" href="/examples/">
      <span class="icon">🧩</span>
      <h2>双语例句</h2>
      <p>从 PPT 提取「马达加斯加语 ↔ 中文」对照句，收藏与背诵打卡。</p>
      <span class="go">进入例句库 →</span>
    </a>
    <a class="card" href="/dict/">
      <span class="icon">🔎</span>
      <h2>马达词典</h2>
      <p>词性、派生词网络与三语释义，DeepSeek 即时生成中文翻译。</p>
      <span class="go">进入词典 →</span>
    </a>
  </section>

  <footer>TENY · 马达加斯加语学习台 · 词源 motmalgache.org</footer>
</main>
</body>
</html>
